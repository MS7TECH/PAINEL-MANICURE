<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Painel Manicure</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f8f8f8; }
        .gold-bg { background: linear-gradient(135deg, #bf953f 0%, #a67c00 100%); }
        .gold-text { color: #bf953f; }
    </style>
</head>
<body class="antialiased">
    <div id="root"></div>

    <script>
        const { useState } = React;
        const h = React.createElement;

        const servicosDisponiveis = [
            { nome: 'Cutilagem', valor: 20.00 },
            { nome: 'Pé', valor: 30.00 },
            { nome: 'Pé e mão', valor: 45.00 },
            { nome: 'Serviço simples', valor: 20.00 }
        ];

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [password, setPassword] = useState('');
            const [form, setForm] = useState({ nome: '', data: '', valor: '', servico: '' });

            if (!isLoggedIn) {
                return h("div", { className: "min-h-screen flex items-center justify-center p-4 sm:p-8" },
                    h("div", { className: "bg-white p-6 sm:p-12 rounded-[2rem] sm:rounded-[2.5rem] shadow-xl w-full max-w-sm text-center" },
                        h("img", { src: "logo.png", alt: "Logo", className: "mx-auto h-20 mb-4" }),
                        h("h1", { className: "text-xl sm:text-2xl font-black mb-6 sm:mb-8" }, "Painel ", h("span", { className: "gold-text" }, "Manicure")),
                        h("input", { type: "password", placeholder: "Senha (1234)", onChange: (e) => setPassword(e.target.value), className: "w-full bg-zinc-50 p-3 sm:p-4 rounded-xl sm:rounded-2xl mb-4 border border-zinc-200 text-center tracking-widest" }),
                        h("button", { onClick: () => password === '1234' ? setIsLoggedIn(true) : alert('Senha incorreta!'), className: "w-full gold-bg text-white p-3 sm:p-4 rounded-xl sm:rounded-2xl font-black" }, "Entrar")
                    )
                );
            }

            const handleServicoChange = (e) => {
                const selected = servicosDisponiveis.find(s => s.nome === e.target.value);
                setForm({ ...form, servico: e.target.value, valor: selected ? selected.valor : '' });
            };

            return h("div", { className: "min-h-screen p-4 sm:p-8 flex items-center justify-center" },
                h("form", { onSubmit: (e) => { e.preventDefault(); alert('Registrado!'); }, className: "bg-white p-6 sm:p-12 rounded-[2rem] sm:rounded-[2.5rem] border border-zinc-100 shadow-xl w-full max-w-lg" },
                    h("h1", { className: "text-2xl sm:text-3xl font-black italic uppercase tracking-tighter mb-6 sm:mb-8" }, "Novo ", h("span", { className: "gold-text" }, "Atendimento")),
                    h("div", { className: "space-y-4 sm:space-y-6" },
                        h("input", { type: "text", placeholder: "Nome da Cliente", required: true, onChange: (e) => setForm({...form, nome: e.target.value}), className: "w-full bg-zinc-50 p-3 sm:p-4 rounded-xl sm:rounded-2xl border border-zinc-200" }),
                        h("div", { className: "grid grid-cols-1 sm:grid-cols-2 gap-4" },
                            h("input", { type: "date", required: true, onChange: (e) => setForm({...form, data: e.target.value}), className: "w-full bg-zinc-50 p-3 sm:p-4 rounded-xl sm:rounded-2xl border border-zinc-200" }),
                            h("input", { type: "text", value: form.valor ? 'R$ ' + form.valor.toFixed(2) : '', readOnly: true, className: "w-full bg-zinc-100 p-3 sm:p-4 rounded-xl sm:rounded-2xl border border-zinc-200 text-zinc-500" })
                        ),
                        h("select", { required: true, onChange: handleServicoChange, className: "w-full bg-zinc-50 p-3 sm:p-4 rounded-xl sm:rounded-2xl border border-zinc-200" },
                            h("option", { value: "" }, "Selecione um serviço"),
                            servicosDisponiveis.map(s => h("option", { key: s.nome, value: s.nome }, s.nome + " (R$ " + s.valor.toFixed(2) + ")"))
                        ),
                        h("button", { type: "submit", className: "w-full gold-bg text-white p-3 sm:p-4 rounded-xl sm:rounded-2xl font-black uppercase tracking-widest text-xs" }, "Registrar Atendimento")
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(App));
    </script>
</body>
</html>
